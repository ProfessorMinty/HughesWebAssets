<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Repository laboratory orbit diagram</title>
  <desc id="desc">A calm aurora-colored orbital illustration used to verify external SVG loading.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.52" stop-color="#312e81"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <radialGradient id="planet">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="0.45" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="640" height="360" rx="30" fill="url(#bg)"/>
  <g fill="#fff" opacity=".8">
    <circle cx="70" cy="72" r="2"/><circle cx="140" cy="280" r="3"/><circle cx="520" cy="64" r="2"/><circle cx="590" cy="242" r="2"/><circle cx="420" cy="302" r="3"/><circle cx="250" cy="42" r="2"/>
  </g>
  <ellipse cx="320" cy="180" rx="220" ry="82" fill="none" stroke="#a5f3fc" stroke-width="4" stroke-dasharray="12 14" opacity=".75"/>
  <ellipse cx="320" cy="180" rx="148" ry="135" fill="none" stroke="#ddd6fe" stroke-width="3" stroke-dasharray="7 12" opacity=".58" transform="rotate(-24 320 180)"/>
  <circle cx="320" cy="180" r="66" fill="url(#planet)" filter="url(#glow)"/>
  <circle cx="505" cy="132" r="20" fill="#f0abfc" filter="url(#glow)"/>
  <circle cx="194" cy="78" r="13" fill="#67e8f9" filter="url(#glow)"/>
  <text x="320" y="188" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" font-weight="800" fill="#111827">HRV</text>
  <text x="320" y="335" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#ecfeff">External SVG asset online</text>
</svg>

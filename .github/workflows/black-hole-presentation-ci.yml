name: Black Hole Museum Presentation Contract

on:
  push:
    branches:
      - feature/arctic-black-hole-museum
    paths:
      - 'apps/black-hole-museum/src/**'
      - 'scripts/build_black_hole.py'
      - 'scripts/test_black_hole_viewport_contract.py'
      - 'scripts/test_black_hole_presentation_contract.py'
      - '.github/workflows/black-hole-presentation-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  presentation-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify proven viewport breakout
        run: python scripts/test_black_hole_viewport_contract.py

      - name: Verify Maximum-Shelf presentation contract
        run: python scripts/test_black_hole_presentation_contract.py

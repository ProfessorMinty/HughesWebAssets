<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">First image of M87* repository acquisition placeholder</title>
  <desc id="desc">The authoritative scientific media file could not be acquired in the current offline implementation environment. The source, classification, and credit remain recorded.</desc>
  <defs>
    <radialGradient id="space" cx="50%" cy="48%" r="70%">
      <stop offset="0" stop-color="#102a4f"/>
      <stop offset=".6" stop-color="#061126"/>
      <stop offset="1" stop-color="#02030a"/>
    </radialGradient>
    <linearGradient id="line" x1="0" x2="1"><stop stop-color="#72edf4"/><stop offset="1" stop-color="#ff9e3d"/></linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#space)"/>
  <g fill="#fff" opacity=".55">
    <circle cx="88" cy="90" r="2"/><circle cx="210" cy="220" r="3"/><circle cx="1120" cy="110" r="2"/>
    <circle cx="980" cy="570" r="3"/><circle cx="340" cy="610" r="2"/><circle cx="760" cy="80" r="2"/>
  </g>
  <circle cx="640" cy="330" r="115" fill="#000" stroke="url(#line)" stroke-width="4"/>
  <ellipse cx="640" cy="330" rx="290" ry="90" fill="none" stroke="url(#line)" stroke-width="22" opacity=".55"/>
  <rect x="120" y="520" width="1040" height="120" rx="24" fill="#02050d" stroke="#72edf4" stroke-opacity=".35"/>
  <text x="640" y="560" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="34" font-weight="800">First image of M87*</text>
  <text x="640" y="602" text-anchor="middle" fill="#bffbff" font-family="ui-monospace,monospace" font-size="18">Observation reconstructed from real radio telescope measurements</text>
  <text x="640" y="635" text-anchor="middle" fill="#ffd9a8" font-family="system-ui,sans-serif" font-size="18">Credit: EHT Collaboration</text>
  <text x="640" y="685" text-anchor="middle" fill="#c0c9da" font-family="system-ui,sans-serif" font-size="17">OFFLINE EVIDENCE BUILD · AUTHORITATIVE FILE NOT VENDORED</text>
</svg>